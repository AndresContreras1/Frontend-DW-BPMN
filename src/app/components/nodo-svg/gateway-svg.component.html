<svg:g>
  <svg:polygon class="dg-gateway" [attr.points]="puntos()" />
  @switch (nodo().subtipo) {
    @case ('EXCLUSIVO') {
      <svg:path class="dg-simbolo" d="M 16 16 L 34 34 M 34 16 L 16 34" />
    }
    @case ('PARALELO') {
      <svg:path class="dg-simbolo" d="M 25 13 V 37 M 13 25 H 37" />
    }
    @default {
      <svg:circle class="dg-simbolo" cx="25" cy="25" r="11" />
    }
  }
  <svg:text class="dg-texto" text-anchor="middle">
    @for (linea of lineas(); track $index) {
      <svg:tspan [attr.x]="nodo().ancho / 2" [attr.y]="nodo().alto + 14 + $index * 13">{{ linea }}</svg:tspan>
    }
  </svg:text>
  <svg:title>{{ nodo().nombre }}</svg:title>
</svg:g>
