<!-- Modal genérico de confirmación, siempre abierto mientras este componente exista (el padre lo crea/destruye con @if).
     Se le pasan el texto, las advertencias de impacto y el estado de "procesando"; sus eventos se reenvían a este componente. -->
<app-modal-confirmacion
  [abierto]="true"
  titulo="Eliminar elemento"
  [mensaje]="mensaje()"
  [advertencias]="advertencias()"
  textoConfirmar="Eliminar"
  [procesando]="procesando()"
  (confirmar)="confirmar()"
  (cancelar)="cancelar.emit()"
/>
