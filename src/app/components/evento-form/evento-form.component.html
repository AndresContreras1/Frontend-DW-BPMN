<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <h3 class="h6">{{ evento() ? 'Editar evento de mensaje' : 'Nuevo evento de mensaje' }}</h3>
  <p class="small text-secondary">El sistema solo modela el mensaje; no lo envía ni lo recibe.</p>
  @if (error()) {
    <div class="alert alert-danger" role="alert" id="alertaErrorEvento">{{ error() }}</div>
  }
  @if (opcionesLanes().length === 0) {
    <div class="alert alert-warning" role="alert">Primero crea una lane: los eventos viven dentro de una lane.</div>
  }
  <app-campo-formulario idCampo="txtNombreEvento" etiqueta="Nombre" [control]="form.controls.nombre" [errorServidor]="erroresServidor()['nombre'] ?? ''" />
  <app-campo-formulario idCampo="selTipoEvento" etiqueta="Tipo de evento" tipo="select" [opciones]="tipos" [control]="form.controls.tipoEvento" />
  <app-campo-formulario idCampo="txtContenidoEvento" etiqueta="Contenido del mensaje" tipo="textarea" ayuda="Datos que viajan en el mensaje, por ejemplo: numeroSolicitud (texto)." [control]="form.controls.contenido" [errorServidor]="erroresServidor()['contenido'] ?? ''" />
  <app-campo-formulario idCampo="txtClaveEvento" etiqueta="Clave de correlación" ayuda="Dato que identifica a qué caso pertenece el mensaje." [control]="form.controls.claveCorrelacion" [errorServidor]="erroresServidor()['claveCorrelacion'] ?? ''" />
  <div class="form-check mb-3">
    <input id="chkOrigenExterno" class="form-check-input" type="checkbox" formControlName="origenExterno" />
    <label for="chkOrigenExterno" class="form-check-label">El mensaje viene de un participante externo</label>
  </div>
  <div (change)="alCambiarLane()">
    <app-campo-formulario idCampo="selLaneEvento" etiqueta="Lane" tipo="select" [opciones]="opcionesLanes()" [control]="form.controls.laneId" />
  </div>
  <div class="row">
    <div class="col-6">
      <app-campo-formulario idCampo="txtPosicionXEvento" etiqueta="Posición X" [control]="form.controls.posicionX" />
    </div>
    <div class="col-6">
      <app-campo-formulario idCampo="txtPosicionYEvento" etiqueta="Posición Y" [control]="form.controls.posicionY" />
    </div>
  </div>
  <div class="d-flex gap-2">
    <button id="btnGuardarEvento" type="submit" class="btn btn-primary" [disabled]="!form.valid || enviando()">{{ evento() ? 'Guardar cambios' : 'Crear evento' }}</button>
    <button id="btnCancelarEvento" type="button" class="btn btn-outline-secondary" (click)="cancelar.emit()">Cancelar</button>
  </div>
</form>
