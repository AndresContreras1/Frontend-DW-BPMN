# Solución completa: PostgreSQL + backend (Spring Boot) + frontend (Angular con nginx).
#   cp .env.example .env     (y completar DB_PASSWORD y JWT_SECRET)
#   docker compose up -d --build
# Frontend: http://localhost:4200 · Backend: http://localhost:8080
# El backend se construye desde la carpeta hermana ../Backend-DW-BPMN.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-procesos}
      POSTGRES_USER: ${DB_USER:-procesos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-procesos} -d ${DB_NAME:-procesos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../Backend-DW-BPMN
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-procesos}
      DB_USER: ${DB_USER:-procesos}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (minimo 32 caracteres) en el archivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
